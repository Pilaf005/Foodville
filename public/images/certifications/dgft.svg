<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" width="100%" height="100%">
  <defs>
    <linearGradient id="dgftNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>
    <linearGradient id="goldIndia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
  </defs>

  <!-- Central Government Emblem Motif -->
  <g transform="translate(10, 8)">
    <rect x="2" y="2" width="68" height="68" rx="14" fill="#E8EAF6" stroke="#9FA8DA" stroke-width="1"/>
    <!-- Stylized Ashoka Pillar / Export Pillar -->
    <path d="M 22 58 L 50 58 L 47 48 L 25 48 Z" fill="#3949AB"/>
    <path d="M 26 48 L 46 48 L 44 26 L 28 26 Z" fill="url(#goldIndia)"/>
    <circle cx="36" cy="34" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M 36 28 L 36 40 M 30 34 L 42 34" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M 24 26 L 48 26 L 44 14 L 28 14 Z" fill="#1A237E"/>
  </g>

  <!-- Typography -->
  <text x="88" y="38" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="url(#dgftNavy)" letter-spacing="1">DGFT</text>
  <text x="88" y="54" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#283593" letter-spacing="0.4">DIRECTORATE GENERAL OF FOREIGN TRADE</text>
  <text x="88" y="68" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#5C6BC0">MINISTRY OF COMMERCE &amp; INDUSTRY, GOVT. OF INDIA</text>
</svg>
