<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" width="100%" height="100%">
  <defs>
    <linearGradient id="isoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01579B"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="isoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>

  <!-- ISO Badge Seal -->
  <g transform="translate(10, 6)">
    <circle cx="38" cy="38" r="36" fill="url(#isoBlue)" stroke="#81D4FA" stroke-width="2"/>
    <circle cx="38" cy="38" r="30" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="38" y="32" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">ISO</text>
    <text x="38" y="47" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#81D4FA" text-anchor="middle">22000</text>
    <text x="38" y="58" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#FFF59D" text-anchor="middle">: 2018</text>
  </g>

  <!-- Typography -->
  <text x="92" y="36" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#01579B">ISO 22000:2018</text>
  <text x="92" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#D32F2F">FOOD SAFETY MANAGEMENT</text>
  <text x="92" y="66" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#546E7A">CERTIFIED QUALITY SYSTEM</text>
</svg>
