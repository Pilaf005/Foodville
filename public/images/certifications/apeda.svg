<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" width="100%" height="100%">
  <defs>
    <linearGradient id="apedaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="apedaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  
  <!-- Wheat / Agro Leaf Emblem -->
  <g transform="translate(10, 8)">
    <circle cx="36" cy="36" r="34" fill="#F1F8E9" stroke="#AED581" stroke-width="1.5"/>
    <!-- Wheat ears -->
    <path d="M 36 60 C 36 40, 22 26, 18 16 C 28 20, 36 34, 36 48 Z" fill="url(#apedaGreen)" />
    <path d="M 36 60 C 36 40, 50 26, 54 16 C 44 20, 36 34, 36 48 Z" fill="url(#apedaGold)" />
    <path d="M 36 50 C 36 30, 36 12, 36 8 C 36 12, 38 30, 36 50 Z" fill="#689F38" />
    <circle cx="28" cy="24" r="3" fill="#F57F17"/>
    <circle cx="44" cy="24" r="3" fill="#2E7D32"/>
    <circle cx="36" cy="18" r="3" fill="#FBC02D"/>
  </g>

  <!-- Typography -->
  <text x="88" y="40" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="28" font-weight="900" fill="#1B5E20" letter-spacing="1">APEDA</text>
  <text x="88" y="56" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#E65100" letter-spacing="0.3">AGRICULTURAL &amp; PROCESSED FOOD</text>
  <text x="88" y="68" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#558B2F">PRODUCTS EXPORT DEVELOPMENT AUTHORITY</text>
</svg>
